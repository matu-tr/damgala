services:
  damgala:
    build: .
    image: ghcr.io/matu-tr/damgala:latest
    container_name: damgala
    restart: unless-stopped
    environment:
      POLL_INTERVAL_MINUTES: "${POLL_INTERVAL_MINUTES:-15}"
      DB_PATH: "/data/damgala.db"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
