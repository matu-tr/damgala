<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Damgala</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #14161a; color: #e6e6e6; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { color: #9a9ea6; font-size: 14px; margin-bottom: 24px; }
  .actions { display: flex; gap: 10px; justify-content: center; }
  a.btn { display: inline-block; padding: 10px 22px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600; }
  a.btn.primary { background: #2a5db0; color: white; }
  a.btn.primary:hover { background: #3a6dc0; }
  a.btn.secondary { border: 1px solid #2a2d33; color: #e6e6e6; }
  a.btn.secondary:hover { border-color: #4a4e57; }
</style>
</head>
<body>
  <div class="box">
    <h1>Damgala</h1>
    <p>Track your watch history across streaming services.</p>
    <div class="actions">
      <a class="btn primary" href="/signup">Sign up</a>
      <a class="btn secondary" href="/login">Log in</a>
    </div>
  </div>
</body>
</html>
