<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Damgala — Log in</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #14161a; color: #e6e6e6; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { width: 320px; }
  h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
  label { display: block; font-size: 13px; color: #9a9ea6; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; margin-bottom: 14px; background: #1e2126; border: 1px solid #2a2d33; border-radius: 4px; color: #e6e6e6; font-size: 14px; }
  button { width: 100%; padding: 10px; background: #2a5db0; color: white; border: none; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:hover { background: #3a6dc0; }
  .error { background: #4d1f24; color: #e39b9b; padding: 8px 10px; border-radius: 4px; font-size: 13px; margin-bottom: 14px; }
  .switch { text-align: center; margin-top: 16px; font-size: 13px; color: #9a9ea6; }
  .switch a { color: #9fc4ff; }
</style>
</head>
<body>
  <div class="box">
    <h1>Log in to Damgala</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <button type="submit">Log in</button>
    </form>
    <div class="switch">Don't have an account? <a href="/signup">Sign up</a></div>
  </div>
</body>
</html>
